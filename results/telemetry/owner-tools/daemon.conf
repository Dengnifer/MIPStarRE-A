# daemon.conf — knobs of results/telemetry/owner-tools/merge-daemon.sh.
#
# Sourced by the daemon as bash.  Every key uses `: "${key:=value}"`, so an
# environment variable of the same name wins over the file and the file wins
# over nothing: the daemon has no hard-coded numbers of its own.  This file is
# a declared dependency of the daemon (its hash is in the installer manifest);
# edit it in the checkout and re-run install.sh, never on the host.
#
# Deliberately NOT here: anything that changes a merge gate.  The daemon merges
# only through local/bin/pr_merge.py and has no knob that can weaken it.

# ---------------------------------------------------------------- identity
: "${repo:=Dengnifer/MIPStarRE-A}"
: "${base_ref:=github/main}"
: "${checkout:=$HOME/MIPStarRE-qpbt}"

# ------------------------------------------------------------- parallelism
# PAR = clamp(1, floor((nproc - load1) / cores_per_build), free_worker_slots),
# re-evaluated every loop (design §3.4).  ghz has 128 cores shared with other
# users' jobs; 16 cores per `lake build` is the measured working figure and is
# an owner policy decision, not a run-time question (design §9.6).
: "${cores_per_build:=16}"

# Reserved for the merge train (local/bin/pr_train.py, issue #502 / PR 507,
# deferred in design §9.1).  The daemon reads it so the knob exists at the
# honest name when the train lands; it has no effect today.
: "${train_max:=8}"

# ------------------------------------------------------------------ repair
# One repair attempt per (PR, head): a second attempt on unchanged inputs
# repeats the same failure and costs a worker slot.
: "${repair_attempts_per_head:=1}"
# Upper bound on concurrent repairs.  Repairs are charged against the SAME PAR
# budget as refreshes, so a burst of conflicts can never starve merges.
: "${repair_max_concurrent:=2}"
# Seconds a repair may run before the daemon stops waiting on its pid file.
: "${repair_timeout_s:=5400}"

# ----------------------------------------------------------------- backoff
# Classes conflict/build clear when their repair finishes, gate/adjudication
# when the head changes; only these two classes carry a time backoff.
: "${backoff_infra_s:=300}"
: "${backoff_preflight_s:=900}"
# An unclassifiable failure is retried as `infra` this many times, then parks
# until the head changes.  Bounded retry, never an infinite loop.
: "${infra_max_attempts:=5}"

# -------------------------------------------------------------- loop shape
: "${scan_timeout_s:=150}"
: "${idle_sleep_s:=45}"
: "${busy_sleep_s:=10}"
: "${scan_fail_sleep_s:=60}"
# Hourly duties: the marker report and the no-merge telemetry batch.
: "${report_interval_s:=3600}"
: "${telemetry_batch_idle_s:=3600}"
# A retirement handoff is retried at most once per this window per PR.
: "${retire_retry_s:=3600}"

# ------------------------------------------------------------- dependencies
# Files that must be installed and hash-matched before the daemon starts
# (design §7.7): a missing or hand-patched dependency is a refusal with one
# progress-log line, not a per-PR failure discovered at merge time.
: "${daemon_deps:=merge.sh daemon-scan.py daemon.conf fix-lane.sh}"
: "${require_manifest:=1}"

# ---------------------------------------------------------------- telemetry
# Empty = decide per run: results/telemetry/merge-latency.jsonl once the union
# merge driver of W7 is in effect for results/telemetry, otherwise a dated file
# so two runs never share a conflicting path (design §3.7).
: "${merge_latency_file:=}"
